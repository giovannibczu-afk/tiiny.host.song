<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Song for You 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-card">
    <div class="album-art">
      <img src="https://picsum.photos/300/300" alt="Album Cover" id="cover">
    </div>

    <div class="song-details">
      <h2 id="title">Pahinga</h2>
      <p id="artist">Moira Dela Torre</p>
    </div>

    <div class="progress-container">
      <span id="current-time">0:00</span>
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button class="btn" id="prev">⏮</button>
      <button class="btn play-btn" id="play">▶</button>
      <button class="btn" id="next">⏭</button>
    </div>

    <div class="message-box">
      <p>✨ "Para sa 'yo 'to. Sana makapag-pahinga ka at maging masaya ang araw mo!" ✨</p>
    </div>
  </div>

  <!-- Note: Inalis ang '/' sa simula para mabasa sa GitHub Pages -->
  <audio id="audio" src="tiktokio.com1792289100_7UvnsOL68mbeJYiuo15x.mp4"></audio>

  <script src="script.js"></script>
</body>
</html>
